name: Frontend Deploy

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Build Docker image
        run: |
          cd frontend
          docker build -t sentiment-frontend .

      - name: Deploy to EC2
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: SSH and run container
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@18.234.231.208 << 'EOF'
            echo "Stopping old frontend container..."
            docker stop sentiment-frontend || true
            docker rm sentiment-frontend || true

            echo "Running new frontend container..."
            docker run -d -p 80:80 --name sentiment-frontend --restart unless-stopped sentiment-frontend
            echo "Frontend deployment complete!"
          EOF
